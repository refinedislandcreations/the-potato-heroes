<!-- HERO -->
<section
  style="
    background-image: url(&quot;assets/images/background.png&quot;);
    background-size: cover;
    background-position: center;
  "
  class="relative overflow-hidden bg-[#FBF9ED] pt-14 md:pt-0"
  data-aos="fade-up"
  data-aos-delay="100"
>
  <div
    class="grid h-[70vh] sm:h-[75vh] md:h-[80vh] lg:h-screen grid-rows-[1fr_2fr] md:grid-rows-1 md:grid-cols-[1fr_2fr] w-full"
  >
    <div class="relative z-10">
      <img
        src="{{ '/assets/images/background-potato.png' | relative_url }}"
        alt="Background Potato"
        class="absolute inset-0 h-full w-full object-cover"
      />

      <!-- logo -->
      <div
        class="relative flex h-full items-center justify-center md:justify-end px-6 md:px-10"
      >
        <img
          src="{{ '/assets/images/proud-potato-peeler.svg' | relative_url }}"
          alt="Proud Potato Peeler Logo"
          class="relative z-20 pointer-events-none w-52 sm:w-64 md:w-[30rem] lg:w-[34rem] max-w-full md:-mr-20 lg:-mr-32"
        />
      </div>
    </div>

    <div class="relative z-0">
      <img
        src="{{ '/assets/images/ppp/ppp_restaurant_interior.webp' | relative_url }}"
        alt="Proud Potato Peeler"
        class="absolute inset-0 h-full w-full object-cover"
      />
    </div>
  </div>
