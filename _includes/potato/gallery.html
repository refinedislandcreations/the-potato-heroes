<!-- LIGHTBOX POPUP (Tetap ada) -->
<div
  id="lightbox"
  class="fixed inset-0 z-[9999] hidden items-center justify-center bg-black/80 px-4 backdrop-blur-sm transition-opacity duration-300"
>
  <div class="relative max-w-6xl w-full flex justify-center">
    <button
      id="lightbox-close"
      class="absolute -top-12 right-0 text-white hover:text-gray-300 text-4xl font-light"
    >
      &times;
    </button>
    <img
      id="lightbox-image"
      src=""
      alt=""
      class="max-h-[85vh] max-w-full rounded-lg shadow-2xl object-contain"
    />
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    /* ---------------------------------------------------
       LOGIC 1: DRAG TO SCROLL (MOUSE)
       --------------------------------------------------- */
    const sliders = document.querySelectorAll(".gallery-drag");
    let isDragging = false;

    sliders.forEach((slider) => {
      let isDown = false;
      let startX;
      let scrollLeft;

      slider.addEventListener("mousedown", (e) => {
        isDown = true;
        isDragging = false;
        slider.classList.add("active");
        slider.classList.add("cursor-grabbing");
        slider.classList.remove("cursor-grab");
        startX = e.pageX - slider.offsetLeft;
        scrollLeft = slider.scrollLeft;
      });

      slider.addEventListener("mouseleave", () => {
        isDown = false;
        slider.classList.remove("cursor-grabbing");
        slider.classList.add("cursor-grab");
      });

      slider.addEventListener("mouseup", () => {
        isDown = false;
        slider.classList.remove("cursor-grabbing");
        slider.classList.add("cursor-grab");

        setTimeout(() => {
          isDragging = false;
        }, 50);
      });

      slider.addEventListener("mousemove", (e) => {
        if (!isDown) return;
        e.preventDefault();

        const x = e.pageX - slider.offsetLeft;
        const walk = (x - startX) * 2;

        if (Math.abs(x - startX) > 5) {
          isDragging = true;
        }

        slider.scrollLeft = scrollLeft - walk;
      });

      const images = slider.querySelectorAll("img");
      images.forEach((img) => {
        img.addEventListener("click", (e) => {
          if (isDragging) {
            e.preventDefault();
            e.stopPropagation();
            return;
          }
          // Buka lightbox jika murni klik
          const src = img.getAttribute("data-lightbox-src");
          if (src) openLightbox(src);
        });
      });

      slider.addEventListener("click", (e) => {
        if (isDragging) return;
      });
    });

    const allImages = document.querySelectorAll(".gallery-drag img");
    allImages.forEach((img) => {
      img.style.pointerEvents = "auto";
      img.addEventListener("dragstart", (e) => {
        e.preventDefault();
      });
    });

    /* ---------------------------------------------------
       LOGIC 2: LIGHTBOX
       --------------------------------------------------- */
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightbox-image");
    const lightboxClose = document.getElementById("lightbox-close");

    function openLightbox(src) {
      if (!lightbox || !src) return;
      lightboxImg.src = src;
      lightbox.classList.remove("hidden");
      lightbox.classList.add("flex");
      document.body.style.overflow = "hidden";
    }

    function closeLightbox() {
      if (!lightbox) return;
      lightbox.classList.add("hidden");
      lightbox.classList.remove("flex");
      lightboxImg.src = "";
      document.body.style.overflow = "";
    }

    if (lightboxClose) {
      lightboxClose.addEventListener("click", closeLightbox);
    }

    if (lightbox) {
      lightbox.addEventListener("click", (e) => {
        if (e.target === lightbox) closeLightbox();
      });
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeLightbox();
    });
  });
</script>
