<!-- FAQS SECTION -->
<section
  id="faqs"
  class="py-16 sm:py-20"
  style="
    background-image: url(&quot;assets/images/background.png&quot;);
    background-size: cover;
    background-position: center;
  "
>
  <div class="mx-auto max-w-6xl px-4">
    <div
      class="text-center max-w-2xl mx-auto"
      data-aos="fade-up"
      data-aos-offset="100"
    >
      <h2 class="text-3xl sm:text-4xl md:text-5xl font-bold mb-3">FAQs</h2>
      <p class="text-xs sm:text-sm text-gray-800">
        Here’s a little help section — and if you need more, we’re only one
        click away.
      </p>
    </div>

    <!-- GRID -->
    <div
      data-aos="fade-up"
      data-aos-offset="100"
      data-aos-delay="200"
      class="mt-10 grid gap-5 sm:gap-6 md:gap-8 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 place-items-center"
    >
      <!-- CARD 1 -->
      <button
        type="button"
        class="faq-flip-card w-full max-w-sm cursor-pointer outline-none"
        data-ppp-faq-card
      >
        <div class="faq-flip-inner relative h-40 sm:h-44 md:h-48 rounded-3xl">
          <!-- front -->
          <div
            class="faq-face faq-front bg-[#F2B7AA] rounded-3xl flex items-center justify-center px-6 text-center"
          >
            <h3 class="font-bold text-sm sm:text-base md:text-lg">
              Is Proud Potato Peeler a restaurant?
            </h3>
          </div>
          <!-- back -->
          <div
            class="faq-face faq-back bg-[#F2B7AA] rounded-3xl flex items-center justify-center px-6 text-center"
          >
            <p class="text-xs sm:text-sm text-gray-800">
              It’s more than a restaurant — it’s a cozy space crafted by Chef
              Alberto where you can relax like you’re at a friend’s place, with
              comfort food, drinks, and warm Greek hospitality.
            </p>
          </div>
        </div>
      </button>

      <!-- CARD 2 -->
      <button
        type="button"
        class="faq-flip-card w-full max-w-sm cursor-pointer outline-none"
        data-ppp-faq-card
      >
        <div class="faq-flip-inner relative h-40 sm:h-44 md:h-48 rounded-3xl">
          <div
            class="faq-face faq-front bg-[#A9B3F0] rounded-3xl flex items-center justify-center px-6 text-center text-black"
          >
            <h3 class="font-bold text-sm sm:text-base md:text-lg">
              Are walk-ins allowed?
            </h3>
          </div>
          <div
            class="faq-face faq-back bg-[#8F9BE0] rounded-3xl flex items-center justify-center px-6 text-center text-black"
          >
            <p class="text-xs sm:text-sm">
              We’re reservations-only. Our chefs prepare daily for each dinner
              service to ensure the best possible dining experience for our
              guests.
            </p>
          </div>
        </div>
      </button>

      <!-- CARD 3 -->
      <button
        type="button"
        class="faq-flip-card w-full max-w-sm cursor-pointer outline-none"
        data-ppp-faq-card
      >
        <div class="faq-flip-inner relative h-40 sm:h-44 md:h-48 rounded-3xl">
          <div
            class="faq-face faq-front bg-[#D2D89D] rounded-3xl flex items-center justify-center px-6 text-center text-black"
          >
            <h3 class="font-bold text-sm sm:text-base md:text-lg">
              Do you accommodate dietary restrictions?
            </h3>
          </div>
          <div
            class="faq-face faq-back bg-[#C4CC87] rounded-3xl flex items-center justify-center px-6 text-center text-black"
          >
            <p class="text-xs sm:text-sm">
              Yes — vegans, halal, pescatarians and more. Tell us your needs at
              least 48 hours in advance and we’ll tailor the menu. Last-minute
              requests depend on what’s available.
            </p>
          </div>
        </div>
      </button>

      <!-- CARD 4 -->
      <button
        type="button"
        class="faq-flip-card w-full max-w-sm cursor-pointer outline-none"
        data-ppp-faq-card
      >
        <div class="faq-flip-inner relative h-40 sm:h-44 md:h-48 rounded-3xl">
          <div
            class="faq-face faq-front bg-[#F0C0B8] rounded-3xl flex items-center justify-center px-6 text-center text-black"
          >
            <h3 class="font-bold text-sm sm:text-base md:text-lg">
              What’s the corkage policy?
            </h3>
          </div>
          <div
            class="faq-face faq-back bg-[#E6AFA5] rounded-3xl flex items-center justify-center px-6 text-center text-black"
          >
            <p class="text-xs sm:text-sm">
              Corkage is $35 for wines (750&nbsp;ml) and $50 for heavy liquor
              (1&nbsp;L). For larger parties, we’re happy to chat and see what
              works best.
            </p>
          </div>
        </div>
      </button>

      <!-- CARD 5 -->
      <button
        type="button"
        class="faq-flip-card w-full max-w-sm cursor-pointer outline-none"
        data-ppp-faq-card
      >
        <div class="faq-flip-inner relative h-40 sm:h-44 md:h-48 rounded-3xl">
          <div
            class="faq-face faq-front bg-[#E8C7B0] rounded-3xl flex items-center justify-center px-6 text-center text-black"
          >
            <h3 class="font-bold text-sm sm:text-base md:text-lg">
              Do you serve cakes for birthdays?
            </h3>
          </div>
          <div
            class="faq-face faq-back bg-[#DDB69A] rounded-3xl flex items-center justify-center px-6 text-center text-black"
          >
            <p class="text-xs sm:text-sm">
              Yes! Let us know if you’re celebrating and we can arrange cakes
              from our sister project Alani at an additional charge.
            </p>
          </div>
        </div>
      </button>

      <!-- CARD 6 -->
      <button
        type="button"
        class="faq-flip-card w-full max-w-sm cursor-pointer outline-none"
        data-ppp-faq-card
      >
        <div class="faq-flip-inner relative h-40 sm:h-44 md:h-48 rounded-3xl">
          <div
            class="faq-face faq-front bg-[#CDA1B7] rounded-3xl flex items-center justify-center px-6 text-center text-black"
          >
            <h3 class="font-bold text-sm sm:text-base md:text-lg">
              What’s the price for dinner?
            </h3>
          </div>
          <div
            class="faq-face faq-back bg-[#BF8CA5] rounded-3xl flex items-center justify-center px-6 text-center text-black"
          >
            <p class="text-xs sm:text-sm">
              Our 6–7 course menu is $140++. Add the drinks bundle for $38++,
              which includes a welcome cocktail and two glasses of Greek
              house-pour wines.
            </p>
          </div>
        </div>
      </button>

      <!-- CARD 7 -->
      <button
        type="button"
        class="faq-flip-card w-full max-w-sm cursor-pointer outline-none"
        data-ppp-faq-card
      >
        <div class="faq-flip-inner relative h-40 sm:h-44 md:h-48 rounded-3xl">
          <div
            class="faq-face faq-front bg-[#F1D39F] rounded-3xl flex items-center justify-center px-6 text-center text-black"
          >
            <h3 class="font-bold text-sm sm:text-base md:text-lg">
              What are your operation days?
            </h3>
          </div>
          <div
            class="faq-face faq-back bg-[#E3C183] rounded-3xl flex items-center justify-center px-6 text-center text-black"
          >
            <p class="text-xs sm:text-sm">
              We’re open Thursday to Saturday. For private events on other days,
              email us at reservations@thepotatoheroes.com and we’ll help you
              plan.
            </p>
          </div>
        </div>
      </button>

      <!-- CARD 8 -->
      <button
        type="button"
        class="faq-flip-card w-full max-w-sm cursor-pointer outline-none"
        data-ppp-faq-card
      >
        <div class="faq-flip-inner relative h-40 sm:h-44 md:h-48 rounded-3xl">
          <div
            class="faq-face faq-front bg-[#B4C9C9] rounded-3xl flex items-center justify-center px-6 text-center text-black"
          >
            <h3 class="font-bold text-sm sm:text-base md:text-lg">
              Where is Proud Potato Peeler located?
            </h3>
          </div>
          <div
            class="faq-face faq-back bg-[#A0B7B7] rounded-3xl flex items-center justify-center px-6 text-center text-black"
          >
            <p class="text-xs sm:text-sm">
              We’re on the 4th floor of the renovated KADA building in the CBD.
              Nearest MRT stations: Maxwell, Tanjong Pagar, and Chinatown.
            </p>
          </div>
        </div>
      </button>

      <!-- CARD 9 -->
      <button
        type="button"
        class="faq-flip-card w-full max-w-sm cursor-pointer outline-none"
        data-ppp-faq-card
      >
        <div class="faq-flip-inner relative h-40 sm:h-44 md:h-48 rounded-3xl">
          <div
            class="faq-face faq-front bg-[#F0B6A2] rounded-3xl flex items-center justify-center px-6 text-center text-black"
          >
            <h3 class="font-bold text-sm sm:text-base md:text-lg">
              Is there a car park available?
            </h3>
          </div>
          <div
            class="faq-face faq-back bg-[#E39D86] rounded-3xl flex items-center justify-center px-6 text-center text-black"
          >
            <p class="text-xs sm:text-sm">
              There are limited bays in the building. For more options, we
              recommend the URA carpark just across the road.
            </p>
          </div>
        </div>
      </button>
    </div>
  </div>
</section>

<style>
  .faq-flip-card {
    perspective: 1000px;
  }
  .faq-flip-inner {
    transform-style: preserve-3d;
    transition: transform 0.6s;
  }
  .faq-flip-card.is-flipped .faq-flip-inner {
    transform: rotateY(180deg);
  }
  .faq-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
  }
  .faq-back {
    transform: rotateY(180deg);
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const cards = document.querySelectorAll("[data-ppp-faq-card]");

    cards.forEach((card) => {
      card.addEventListener("click", () => {
        // Close others
        cards.forEach((c) => {
          if (c !== card) c.classList.remove("is-flipped");
        });
        // Toggle this one
        card.classList.toggle("is-flipped");
      });

      card.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          card.click();
        }
      });
    });
  });
</script>
