<!-- TOP NAV -->
<header class="fixed top-0 left-0 right-0 z-50 bg-[#FBF9ED] shadow-md">
  <div
    class="mx-auto px-4 sm:px-6 lg:px-10 xl:px-14 py-4 flex items-center justify-between"
  >
    <a href="{{ '/' | relative_url }}">
      {% if page.url contains 'alani' %}
      <img
        src="{{ '/assets/images/alani.svg' | relative_url }}"
        alt="Alani"
        class="h-6 md:h-8"
      />
      {% elsif page.url contains 'proud-potato-peeler' %}
      <img
        src="{{ '/assets/images/logo-proud-potato.svg' | relative_url }}"
        alt="Proud Potato"
        class="h-6 md:h-8"
      />
      {% else %}
      <img
        src="{{ '/assets/images/logo-potato-heroes.svg' | relative_url }}"
        alt="Potato Heroes"
        class="h-6 md:h-8"
      />
      {% endif %}

    <button id="menu-toggle" class="flex flex-col gap-1.5">
      <span class="block h-[2px] w-6 rounded-full bg-[#b9846a]"></span>
      <span class="block h-[2px] w-5 rounded-full bg-[#b9846a]"></span>
      <span class="block h-[2px] w-4 rounded-full bg-[#b9846a]"></span>
    </button>
  </div>

  <!-- Drawer Menu -->
  <div id="mobile-menu" class="fixed inset-0 z-[9999] hidden">
    <div
      class="absolute inset-0 bg-black bg-opacity-50"
      id="menu-overlay"
    ></div>
    <div

      style="
        background-image: url('{{ '/assets/images/background.webp' | relative_url }}');
        background-size: cover;
        background-position: center;
      "
    >
      <div class="px-8 py-8">
        <div class="flex justify-end mb-8">
          <button id="menu-close" class="text-gray-800 hover:text-[#b9846a]">
            <svg
              class="w-8 h-8"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              ></path>
            </svg>
          </button>
        </div>

        <div class="space-y-4 mb-12 mt-16">
          <!-- Alani -->
          <div
            class="w-full flex items-center justify-between text-gray-800 text-xl font-bold"
          >
            <a
              href="/alani.html"
              class="hover:text-[#b9846a] flex-grow menu-link"
              >Alani</a
            >

            <button id="alani-toggle" class="p-2 hover:text-[#b9846a]">
              <svg
                class="w-6 h-6 transform transition-transform"
                id="alani-arrow"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M19 9l-7 7-7-7"
                ></path>
              </svg>
            </button>
          </div>

          <div id="alani-dropdown" class="hidden pl-4 space-y-3">
            <a
              href="/alani.html#about"
              class="block text-base text-gray-800 hover:text-[#b9846a] menu-link"
              >About</a
            >
            <a
              href="/alani.html#gallery"
              class="block text-base text-gray-800 hover:text-[#b9846a] menu-link"
              >Gallery</a
            >
            <a
              href="/alani.html#menu"
              class="block text-base text-gray-800 hover:text-[#b9846a] menu-link"
              >Menu</a
            >
            <a
              href="/alani.html#reviews"
              class="block text-base text-gray-800 hover:text-[#b9846a] menu-link"
              >Reviews</a
            >
            <a
              href="/alani.html#faqs"
              class="block text-base text-gray-800 hover:text-[#b9846a] menu-link"
              >FAQs</a
            >
            <a
              href="/alani.html#findus"
              class="block text-base text-gray-800 hover:text-[#b9846a] menu-link"
              >Find Us</a

            <div class="space-y-2 pt-2">
              <button

                  window.open(

            </div>
          </div>

          <!-- Proud Potato Peeler -->
          <div
            class="w-full flex items-center justify-between text-gray-800 text-xl font-bold"
          >
            <a
              href="/proud-potato-peeler.html"
              class="hover:text-[#b9846a] flex-grow menu-link"

            >

            <button id="potato-toggle" class="p-2 hover:text-[#b9846a]">
              <svg
                class="w-6 h-6 transform transition-transform"
                id="potato-arrow"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M19 9l-7 7-7-7"
                ></path>
              </svg>
            </button>
          </div>

          <div id="potato-dropdown" class="hidden pl-4 space-y-3">
            <a
              href="/proud-potato-peeler.html#about"
              class="block text-base text-gray-800 hover:text-[#b9846a] menu-link"
              >About</a
            >
            <a
              href="/proud-potato-peeler.html#gallery"
              class="block text-base text-gray-800 hover:text-[#b9846a] menu-link"
              >Gallery</a
            >
            <a
              href="/proud-potato-peeler.html#menu"
              class="block text-base text-gray-800 hover:text-[#b9846a] menu-link"
              >Menu</a
            >
            <a
              href="/proud-potato-peeler.html#reviews"
              class="block text-base text-gray-800 hover:text-[#b9846a] menu-link"
              >Reviews</a
            >
            <a
              href="/proud-potato-peeler.html#faqs"
              class="block text-base text-gray-800 hover:text-[#b9846a] menu-link"
              >FAQs</a
            >
            <a
              href="/proud-potato-peeler.html#findus"
              class="block text-base text-gray-800 hover:text-[#b9846a] menu-link"
              >Find Us</a

            <div class="space-y-2 pt-2">
              <!-- <button
                class="w-full border-2 border-[#BA3914] bg-transparent text-gray-800 py-2 px-4 text-sm font-semibold hover:bg-[#BA3914] hover:text-white transition-all order-btn"
                style="border-radius: 16px"
              >
                Order Online
              </button> -->
              <button
                class="w-full border-2 border-[#496BBB] bg-transparent text-gray-800 py-2 px-4 text-sm font-semibold hover:bg-[#496BBB] hover:text-white transition-all reservation-btn"
                style="border-radius: 16px"
                onclick="
                  window.open(
                    'https://www.sevenrooms.com/explore/proudpotatopeeler/reservations/create/search/',
                    '_blank',
                  )
                "
              >
                Make Reservation
              </button>
            </div>
          </div>

          <!-- Proud Perfect Potions -->
          <div
            class="w-full flex items-center justify-between text-gray-800 text-xl font-bold"
          >
            <a
              href="/proud-perfect-potions.html"
              class="hover:text-[#b9846a] flex-grow menu-link"
              >Proud Perfect Potions</a
            >

            <button id="potions-toggle" class="p-2 hover:text-[#b9846a]">
              <svg
                class="w-6 h-6 transform transition-transform"
                id="potions-arrow"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M19 9l-7 7-7-7"
                ></path>
              </svg>
            </button>
          </div>

          <div id="potions-dropdown" class="hidden pl-4 space-y-3">
            <a
              href="/proud-perfect-potions.html"
              class="block text-base text-gray-800 hover:text-[#b9846a] menu-link"
              >Coming Soon</a
            >
          </div>
        </div>

        <div class="flex flex-col gap-4 mt-8">
          <a
            href="/daily-heroes.html"
            class="text-gray-800 text-xl font-bold hover:text-[#b9846a] menu-link"
            >The Daily Heroes</a
          >
          <a
            href="/career.html"
            class="text-gray-800 text-xl font-bold hover:text-[#b9846a] menu-link"
            >Career</a
          >
          <a
            href="/contact.html"
            class="text-gray-800 text-xl font-bold hover:text-[#b9846a] menu-link"
            >Contact</a
          >
        </div>
      </div>
    </div>
  </div>
</header>

<script>
  // Menu elements
  const menuToggle = document.getElementById("menu-toggle");
  const menuClose = document.getElementById("menu-close");
  const menu = document.getElementById("mobile-menu");
  const menuOverlay = document.getElementById("menu-overlay");
  const drawer = menu ? menu.querySelector(".transform") : null;

  let isMenuOpen = false;

  function openMenu() {
    if (!menu || !drawer) return;
    menu.classList.remove("hidden");
    document.body.style.overflow = "hidden";
    isMenuOpen = true;
    // Force reflow
    void drawer.offsetWidth;
    drawer.classList.remove("translate-x-full");
  }

  function closeMenu() {
    if (!menu || !drawer) return;
    drawer.classList.add("translate-x-full");
    document.body.style.overflow = "";
    isMenuOpen = false;
    // Wait for transition to complete before hiding
    setTimeout(() => {
      if (menu && !isMenuOpen) {
        menu.classList.add("hidden");
      }
    }, 300);
  }

  if (menuToggle) menuToggle.addEventListener("click", openMenu);
  if (menuClose) menuClose.addEventListener("click", closeMenu);
  if (menuOverlay) menuOverlay.addEventListener("click", closeMenu);

  // Close menu when clicking on any menu link
  const menuLinks = document.querySelectorAll(".menu-link");
  menuLinks.forEach((link) => {
    link.addEventListener("click", (e) => {
      // For hash links, prevent default to handle smooth scroll
      const href = link.getAttribute("href");
      if (href && href.includes("#")) {
        e.preventDefault();
        const [pagePath, hash] = href.split("#");
        const currentPath = window.location.pathname;

        // If on same page, just scroll to element
        if (
          currentPath === pagePath ||
          pagePath === "" ||
          pagePath === currentPath
        ) {
          const targetElement = document.getElementById(hash);
          if (targetElement) {
            closeMenu();
            setTimeout(() => {
              targetElement.scrollIntoView({ behavior: "smooth" });
            }, 350);
          }
        } else {
          // Navigate to different page with hash
          closeMenu();
          setTimeout(() => {
            window.location.href = href;
          }, 350);
        }
      } else {
        // Regular link - close menu and navigate
        e.preventDefault();
        closeMenu();
        setTimeout(() => {
          window.location.href = href;
        }, 350);
      }
    });
  });

  // Handle Order Online buttons
  const orderBtns = document.querySelectorAll(".order-btn");
  orderBtns.forEach((btn) => {
    btn.addEventListener("click", (e) => {
      e.preventDefault();
      closeMenu();
      // Add your order online logic here
      console.log("Order Online clicked");
    });
  });

  // Handle Make Reservation buttons
  const reservationBtns = document.querySelectorAll(".reservation-btn");
  reservationBtns.forEach((btn) => {
    btn.addEventListener("click", (e) => {
      e.preventDefault();
      closeMenu();
      // Add your reservation logic here
      console.log("Make Reservation clicked");
    });
  });

  // Dropdown toggles
  const alaniToggle = document.getElementById("alani-toggle");
  const alaniDropdown = document.getElementById("alani-dropdown");
  const alaniArrow = document.getElementById("alani-arrow");
  const potatoToggle = document.getElementById("potato-toggle");
  const potatoDropdown = document.getElementById("potato-dropdown");
  const potatoArrow = document.getElementById("potato-arrow");
  const potionsToggle = document.getElementById("potions-toggle");
  const potionsDropdown = document.getElementById("potions-dropdown");
  const potionsArrow = document.getElementById("potions-arrow");

  if (alaniToggle) {
    alaniToggle.addEventListener("click", function (e) {
      e.stopPropagation();
      alaniDropdown.classList.toggle("hidden");
      if (alaniArrow) alaniArrow.classList.toggle("rotate-180");
      if (!alaniDropdown.classList.contains("hidden")) {
        if (potatoDropdown) potatoDropdown.classList.add("hidden");
        if (potatoArrow) potatoArrow.classList.remove("rotate-180");
        if (potionsDropdown) potionsDropdown.classList.add("hidden");
        if (potionsArrow) potionsArrow.classList.remove("rotate-180");
      }
    });
  }

  if (potatoToggle) {
    potatoToggle.addEventListener("click", function (e) {
      e.stopPropagation();
      potatoDropdown.classList.toggle("hidden");
      if (potatoArrow) potatoArrow.classList.toggle("rotate-180");
      if (!potatoDropdown.classList.contains("hidden")) {
        if (alaniDropdown) alaniDropdown.classList.add("hidden");
        if (alaniArrow) alaniArrow.classList.remove("rotate-180");
        if (potionsDropdown) potionsDropdown.classList.add("hidden");
        if (potionsArrow) potionsArrow.classList.remove("rotate-180");
      }
    });
  }

  if (potionsToggle) {
    potionsToggle.addEventListener("click", function (e) {
      e.stopPropagation();
      potionsDropdown.classList.toggle("hidden");
      if (potionsArrow) potionsArrow.classList.toggle("rotate-180");
      if (!potionsDropdown.classList.contains("hidden")) {
        if (alaniDropdown) alaniDropdown.classList.add("hidden");
        if (alaniArrow) alaniArrow.classList.remove("rotate-180");
        if (potatoDropdown) potatoDropdown.classList.add("hidden");
        if (potatoArrow) potatoArrow.classList.remove("rotate-180");
      }
    });
  }

  // Auto open according to current URL
  (function () {
    const currentUrl = window.location.pathname.toLowerCase();

    if (currentUrl.includes("alani")) {
      if (alaniDropdown) alaniDropdown.classList.remove("hidden");
      if (alaniArrow) alaniArrow.classList.add("rotate-180");
    } else if (currentUrl.includes("proud-potato-peeler")) {
      if (potatoDropdown) potatoDropdown.classList.remove("hidden");
      if (potatoArrow) potatoArrow.classList.add("rotate-180");
    } else if (currentUrl.includes("proud-perfect-potions")) {
      if (potionsDropdown) potionsDropdown.classList.remove("hidden");
      if (potionsArrow) potionsArrow.classList.add("rotate-180");
    }
  })();
</script>
